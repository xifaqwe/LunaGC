name: Build LunaGC

on:
  push:
    branches: [ 6.1.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew jar -PskipHandbook=1

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LunaGC-6.1.0-JAR
          path: ./*.jar
